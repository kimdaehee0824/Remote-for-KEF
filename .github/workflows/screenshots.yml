name: Screenshots

# Screenshots for the README and releases. The app runs against the simulated speaker (--demo)
# and the system takes the picture, so Liquid Glass and acrylic show as they do on screen.
on:
  workflow_dispatch:
  push:
    branches: [work/screenshots]

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version && system_profiler SPDisplaysDataType
      - run: scripts/build-app.sh
      - name: Screenshots, light and dark
        run: |
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$out"
          app="build/Remote for KEF.app/Contents/MacOS/KEFRemote"
          for mode in light dark; do
            dark=false
            if [ "$mode" = dark ]; then dark=true; fi
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark"
            sleep 2
            "$app" --demo &
            pid=$!
            sleep 8
            screencapture -x "$out/mac-$mode.png"
            kill "$pid"
            wait "$pid" 2>/dev/null || true
            sleep 1
          done
          sips -g pixelWidth -g pixelHeight "$out"/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/screenshots

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish app (x64)
        run: dotnet publish windows/src/KefRemote.App/KefRemote.App.csproj -c Release -r win-x64 -p:Platform=x64 -o dist/RemoteForKEF-win-x64
      - name: Screenshots, light and dark
        shell: pwsh
        run: |
          $out = Join-Path $pwd 'screenshots'
          New-Item -ItemType Directory -Force $out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Native -Name User32 -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)]
          public static extern IntPtr SendMessageTimeout(IntPtr hWnd, uint msg, UIntPtr wParam, string lParam, uint flags, uint timeout, out UIntPtr result);
          '@
          $personalize = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $personalize)) { New-Item -Path $personalize | Out-Null }
          Set-ItemProperty $personalize EnableTransparency 1 -Type DWord
          [System.Windows.Forms.Screen]::PrimaryScreen | Format-List
          foreach ($mode in 'light', 'dark') {
            $light = if ($mode -eq 'light') { 1 } else { 0 }
            Set-ItemProperty $personalize AppsUseLightTheme $light -Type DWord
            Set-ItemProperty $personalize SystemUsesLightTheme $light -Type DWord
            $r = [UIntPtr]::Zero
            [Native.User32]::SendMessageTimeout([IntPtr]0xffff, 0x1A, [UIntPtr]::Zero, 'ImmersiveColorSet', 2, 5000, [ref]$r) | Out-Null
            Start-Sleep 3
            $p = Start-Process -FilePath 'dist/RemoteForKEF-win-x64/RemoteForKEF.exe' -ArgumentList '--demo' -PassThru
            Start-Sleep 12
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $out "win-$mode.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
            Stop-Process -Id $p.Id -Force
            Start-Sleep 2
          }
          Get-ChildItem $out
          $log = Join-Path $env:TEMP 'RemoteForKEF-demo\log.txt'
          if (Test-Path $log) { Get-Content $log }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: screenshots

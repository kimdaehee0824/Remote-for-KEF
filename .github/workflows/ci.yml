name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test windows/tests/KefRemote.Tests/KefRemote.Tests.csproj -c Release

      - name: Publish app (x64, ARM64)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $platform = if ($arch -eq 'x64') { 'x64' } else { 'ARM64' }
            dotnet publish windows/src/KefRemote.App/KefRemote.App.csproj -c Release -r "win-$arch" -p:Platform=$platform -o "dist/RemoteForKEF-win-$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Runs the real app against a simulated speaker, walks every screen state and saves screenshots,
      # once per UI language.
      - name: UI self-test (x64)
        shell: pwsh
        run: |
          foreach ($lang in 'ko', 'en', 'ja') {
            $out = Join-Path $pwd "self-test/$lang"
            $p = Start-Process -FilePath 'dist/RemoteForKEF-win-x64/RemoteForKEF.exe' -ArgumentList '--self-test', "`"$out`"", '--lang', $lang -PassThru
            $done = $p.WaitForExit(240000)
            if (-not $done) { $p.Kill() }
            Write-Output "== $lang"
            if (Test-Path "$out/report.txt") { Get-Content "$out/report.txt" }
            if (Test-Path "$out/settings/log.txt") { Get-Content "$out/settings/log.txt" }
            if (-not $done) { throw "self-test ($lang) timed out" }
            if ($p.ExitCode -ne 0) { throw "self-test ($lang) failed with exit code $($p.ExitCode)" }
          }

      - name: Upload self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-self-test
          path: self-test
          if-no-files-found: warn

      - name: Upload app (x64)
        uses: actions/upload-artifact@v4
        with:
          name: RemoteForKEF-win-x64
          path: dist/RemoteForKEF-win-x64

      - name: Upload app (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: RemoteForKEF-win-arm64
          path: dist/RemoteForKEF-win-arm64

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      # Universal (Apple silicon + Intel) app bundle, ad hoc signed.
      - run: scripts/build-app.sh --universal
      # build-app.sh falls back to the generic icon when actool can't compile AppIcon.icon;
      # here that should fail instead of shipping the generic icon.
      - name: App icon compiled
        run: test -f "build/Remote for KEF.app/Contents/Resources/Assets.car" && test -f "build/Remote for KEF.app/Contents/Resources/AppIcon.icns"
      # Every panel state and settings tab against a simulated speaker, once per UI language:
      # PNGs and report.txt, exit 0 only on pass.
      - name: UI self-test
        run: |
          status=0
          for lang in ko en ja; do
            out="$RUNNER_TEMP/mac-self-test/$lang"
            "build/Remote for KEF.app/Contents/MacOS/KEFRemote" --self-test "$out" --lang "$lang" &
            pid=$!
            for _ in $(seq 1 180); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "self-test ($lang) timed out"; status=1; else wait "$pid" || status=$?; fi
            echo "== $lang"
            cat "$out/report.txt" || echo "no report"
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-self-test
          path: ${{ runner.temp }}/mac-self-test
      - name: Zip app
        run: ditto -c -k --keepParent "build/Remote for KEF.app" "build/RemoteForKEF-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteForKEF-macos
          path: macos/build/RemoteForKEF-macos.zip

  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libssl-dev pkg-config
      - run: swift test

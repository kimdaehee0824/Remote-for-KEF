name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build windows/KefRemote.slnx -c Release
      - run: dotnet test windows/KefRemote.slnx -c Release --no-build

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      # Compiles the SwiftUI app target and assembles the .app bundle.
      - run: scripts/build-app.sh

  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libssl-dev pkg-config
      - run: swift test
